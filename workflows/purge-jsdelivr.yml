name: Purge jsDelivr

on:
  push:
    branches: [main]
    paths: ["script.js", "css.css"]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purger les caches jsDelivr
        run: |
          curl -s "https://purge.jsdelivr.net/gh/kousto/portfolio-v1@main/script.js"
          curl -s "https://purge.jsdelivr.net/gh/kousto/portfolio-v1@main/css.css"